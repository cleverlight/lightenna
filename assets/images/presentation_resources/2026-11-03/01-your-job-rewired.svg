<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Your job, rewired</title>
<desc id="d">Three working weeks as stacked bars: a graduate in 2000, mostly gathering, drafting and formatting; a graduate in 2026, briefing and directing AI agents, checking, some innovation and working with people; and an experienced colleague in 2026, who has no time left to innovate but does far more decisions and judgement and managing people. Bands show where the time moves. Two cards name the step up: grow your experience, and learn to lead people.</desc>
